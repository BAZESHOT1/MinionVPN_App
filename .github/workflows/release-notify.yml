name: Notify Telegram on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # HTML-escape: только &, <, >
          escape_html() {
            printf '%s' "$1" \
              | sed 's/&/\&amp;/g' \
              | sed 's/</\&lt;/g' \
              | sed 's/>/\&gt;/g'
          }

          ESCAPED_NAME=$(escape_html "$RELEASE_NAME")
          ESCAPED_TAG=$(escape_html "$RELEASE_TAG")
          ESCAPED_BODY=$(escape_html "$RELEASE_BODY")
          ESCAPED_URL=$(escape_html "$RELEASE_URL")

          TEXT="<b>🚀 Новый релиз MinionVPN</b>

          <b>${ESCAPED_NAME}</b>
          Тег: <code>${ESCAPED_TAG}</code>

          ${ESCAPED_BODY}

          <a href=\"${ESCAPED_URL}\">Открыть на GitHub</a>"

          echo "Отправляем в chat_id=$CHAT_ID, thread_id=$THREAD_ID"
          echo "Текст сообщения:"
          echo "$TEXT"
          echo "---"

          curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "message_thread_id=${THREAD_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=false" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/response.json \
            -w "HTTP %{http_code}\n"

          echo "Ответ Telegram:"
          cat /tmp/response.json
